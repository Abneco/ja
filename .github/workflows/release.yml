name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+'

permissions:
  contents: read

jobs:
  release:
    name: Release
    if: ${{ github.repository == 'Netflix/ja' }}
    environment: Maven Central
    runs-on: ubuntu-latest
    env:
      BOOTSTRAP_JA_VERSION: 0.17.2
    steps:
      - uses: actions/checkout@v6

      - name: Set up Zulu JDK
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 25

      - name: Configure release
        run: |
          echo "BUILD_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          echo "BOOTSTRAP_JAVA_HOME=$RUNNER_TEMP/ja-bootstrap" >> "$GITHUB_ENV"
          echo "BUILT_JAVA_HOME=$RUNNER_TEMP/ja-built" >> "$GITHUB_ENV"

      - name: Link bootstrap ja development JDK
        run: >-
          .github/scripts/link-ja-development-jdk.sh
          "$JAVA_HOME"
          "$BOOTSTRAP_JAVA_HOME"
          "$BOOTSTRAP_JA_VERSION"

      - name: Build native launchers with Zig
        run: src/launcher/build.sh

      - name: Test with bootstrap ja
        run: '"$BOOTSTRAP_JAVA_HOME/bin/ja" test --all'

      - name: Build ja with bootstrap ja
        run: |
          for module in com.netflix.tools.cli com.netflix.tools.launcher com.netflix.tools.ja; do
            "$BOOTSTRAP_JAVA_HOME/bin/ja" \
              -C "src/$module" \
              maven install \
              --module-version "$BUILD_VERSION"
          done

      - name: Link built ja development JDK
        run: >-
          .github/scripts/link-ja-development-jdk.sh
          "$JAVA_HOME"
          "$BUILT_JAVA_HOME"
          "$BUILD_VERSION"

      - name: Test with built ja
        run: '"$BUILT_JAVA_HOME/bin/ja" test --all'

      - name: Publish to Maven Central with built ja
        run: |
          for module in com.netflix.tools.cli com.netflix.tools.launcher com.netflix.tools.ja; do
            "$BUILT_JAVA_HOME/bin/ja" \
              -C "src/$module" \
              maven deploy-central \
              --module-version "$BUILD_VERSION" \
              --merge-consumer-pom ../../consumer.pom
          done
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.ORG_SONATYPE_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.ORG_SONATYPE_PASSWORD }}
          MAVEN_GPG_KEY: ${{ secrets.ORG_SIGNING_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.ORG_SIGNING_PASSWORD }}
